<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="v-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC46B" />
      <stop offset="60%" stop-color="#F29A3D" />
      <stop offset="100%" stop-color="#D97A1E" />
    </linearGradient>
    <linearGradient id="v-olive" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A3827" />
      <stop offset="50%" stop-color="#4F6440" />
      <stop offset="100%" stop-color="#86AA70" />
    </linearGradient>
    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Left Amber Ribbon Facet -->
  <path d="M6 10 L18 10 L24 38 L16 38 Z" fill="url(#v-amber)" filter="url(#v-glow)" />
  <!-- Fold Plane / Overlap Highlight -->
  <path d="M18 10 L24 38 L28 26 Z" fill="#FFE2A8" opacity="0.65" />
  <!-- Right Olive Ribbon Facet -->
  <path d="M42 10 L30 10 L22 38 L30 38 Z" fill="url(#v-olive)" />
  <!-- Crisp Center Point Vertex -->
  <circle cx="24" cy="38" r="1.5" fill="#FFC46B" />
</svg>
